name: Contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soroban:
    name: Soroban · build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # rustfmt runs in the CI as a fixer, not a gate: the repo is the source of
      # truth for behaviour, not for whitespace, and a red build for a line break
      # hides the tests that actually matter.
      - name: cargo fmt
        run: |
          cargo fmt --all
          git diff --stat

      - name: cargo test (the promises, as tests)
        run: cargo test --workspace --all-targets

      # The Blend adapter is its own workspace: Blend's SDK targets soroban-sdk 25 while
      # the vault is on 29, and the two cannot share one lockfile.
      - name: cargo test · Blend adapter
        working-directory: contracts/keelson-blend-adapter
        run: cargo test --all-targets

      # soroban-sdk 29 refuses to emit wasm without stellar-cli, so the CLI is part of
      # the toolchain rather than an optional convenience.
      - name: Install stellar-cli
        run: |
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/stellar-cli.tgz
          tar -xzf /tmp/stellar-cli.tgz -C /tmp
          sudo install -m 0755 /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Build the wasm the chain will actually run
        run: stellar contract build

      - name: Build the adapter wasm
        working-directory: contracts/keelson-blend-adapter
        run: stellar contract build

      - name: Report artifact sizes
        run: |
          ls -lh target/wasm32v1-none/release/*.wasm
          for f in target/wasm32v1-none/release/*.wasm keelson-blend-adapter/target/wasm32v1-none/release/*.wasm; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            test "$size" -lt 120000 || { echo "wasm over 120KB, tighten it"; exit 1; }
          done

      # The wasm is the deliverable, not a build by-product: the testnet deploy job
      # consumes exactly these files, so they are published with the run.
      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            contracts/target/wasm32v1-none/release/keelson_vault.wasm
            contracts/keelson-blend-adapter/target/wasm32v1-none/release/keelson_blend_adapter.wasm
          if-no-files-found: error
