name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go · vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "These files are not gofmt-ed:"; echo "$fmt"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: build binaries
        run: |
          go build -o bin/compass-api ./cmd/api
          go build -o bin/snapshot ./cmd/snapshot

      - name: smoke test the API (no network providers required)
        run: |
          ./bin/compass-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8080/api/v1/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status": "ok"' /tmp/health.json

  frontend:
    name: Astro · build (static)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (snapshot data, repo base path)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - name: Assert the pages actually contain data
        run: |
          test -f dist/index.html
          test -f dist/venues/index.html
          grep -q "Total balance" dist/index.html
          grep -q "refused" dist/index.html
          echo "pages: $(find dist -name '*.html' | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/dist
          retention-days: 7
