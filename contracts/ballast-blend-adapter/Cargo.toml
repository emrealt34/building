# Its own workspace on purpose: the adapter is built against soroban-sdk 25 (the version
# Blend's SDK targets) while the vault is on 29. Cargo cannot resolve both in one
# workspace, and there is no reason to force them together — the contracts only ever
# exchange addresses and i128s across the call boundary.
[workspace]

[package]
name = "ballast-blend-adapter"
version = "0.1.0"
edition = "2021"
description = "Ballast adapter for the Blend lending pool: the venue the vault earns yield in."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# The Blend SDK ships the pool's real ABI (contractimport of pool.wasm), so the adapter
# speaks Blend's own types rather than a hand-copied guess of them. It is built against
# soroban-sdk 25, which is why this crate pins 25 while the vault uses 29: the two
# contracts only ever exchange addresses and i128s, so they never share these types.
[dependencies]
soroban-sdk = "25"
blend-contract-sdk = "2.25"

[dev-dependencies]
soroban-sdk = { version = "25", features = ["testutils"] }

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
