[package]
name = "ballast-vault"
version = "0.1.0"
edition = "2021"
description = "Ballast UserVault: a non-custodial USDC vault whose automation is bounded by a policy the owner signs."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "29"

[dev-dependencies]
soroban-sdk = { version = "29", features = ["testutils"] }
